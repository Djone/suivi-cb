# Utilisation des workers et gestion des connexions
worker_processes auto;
events {
  worker_connections 1024;
}

http {
  # Types MIME pour les fichiers courants
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Améliorations de performance et sécurité
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off; # Ne pas afficher la version de Nginx

  # Compression Gzip pour réduire la taille des fichiers
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Configuration du serveur principal pour l'application Angular
  server {
    listen 80;
    server_name localhost;

    # Protection du frontend, y compris les réponses d’erreur.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Observe this candidate policy in preproduction before enforcement.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://auth.jolurie.com; frame-src 'self' https://auth.jolurie.com; frame-ancestors 'self'; form-action 'self' https://auth.jolurie.com" always;
    client_max_body_size 100k;

    # Dossier racine où se trouvent les fichiers de l'application
    root /usr/share/nginx/html;

    # Fichier d'index principal
    index index.html index.htm;

    # Règle cruciale pour les Single Page Applications (SPA)
    # Toutes les requêtes qui ne correspondent pas à un fichier ou un dossier
    # sont redirigées vers index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Keycloak silent SSO returns inside an iframe from this same origin.
    # Defining headers here replaces inherited add_header directives.
    location = /silent-check-sso.html {
      try_files $uri =404;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://auth.jolurie.com; frame-src 'self' https://auth.jolurie.com; frame-ancestors 'self'; form-action 'self' https://auth.jolurie.com" always;
      add_header Cache-Control "no-store" always;
    }

    # Redirection des requêtes API vers le backend
    # Permet au frontend (sur /) de communiquer avec le backend (sur /api)
    # sans problèmes de CORS en production.
    location /api {
      # Le nom 'backend' est résolu par Docker Compose en l'IP du conteneur backend.
      # Nginx provides these headers once for API responses, including errors.
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_pass http://backend:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestion des erreurs
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
